name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  # Tests, including the collectortest suite, lint, release builds,
  # conformance, and govulncheck. On a pull request it also compares each
  # scenario's output with the latest release's.
  collector:
    uses: locktivity/epack/.github/workflows/collector-ci.yaml@f622b7511bfdececc0b9b5177fc313c6f8c76f51 # v0.9.5
    with:
      name: clickhouse
      conformance-secrets: CLICKHOUSE_KEY_ID CLICKHOUSE_KEY_SECRET CLICKHOUSE_DB_PASSWORD
